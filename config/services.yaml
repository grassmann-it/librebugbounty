parameters:
  app.email_model: 'gpt-6.2-sol'
  app.email_reasoning: 'medium'
  app.email_gmail_socket: ''
  app.email_gmail_account: ''
  app.cribrum_candidate_directory: ''
  app.cribrum_candidate_mode: 'shadow'
  app.evidence_storage_dir: '%env(resolve:EVIDENCE_STORAGE_DIR)%'
  app.playwright_worker_url: '%env(PLAYWRIGHT_WORKER_URL)%'
  app.retest_default_timeout_ms: '%env(int:RETEST_DEFAULT_TIMEOUT_MS)%'
  # Keep expected IDs in sync with the supervised daemons. For a smaller
  # deployment remove the matching entries as well as the DDEV workers.
  app.health_workers:
    recheck:
      recheck-1: '%env(PLAYWRIGHT_WORKER_URL)%'
      recheck-2: '%env(PLAYWRIGHT_WORKER_URL)%'
    screenshot:
      shot-1: 'http://playwright-shot-1:3000'
      shot-2: 'http://playwright-shot-2:3000'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      - '../src/Service/EmailPreparationException.php'

  App\Service\EmailDraftClientInterface: '@App\Service\OpenAiEmailDraftClient'
  App\Service\GmailDraftGatewayInterface: '@App\Service\UnixSocketGmailDraftGateway'

  App\Service\UnixSocketGmailDraftGateway:
    arguments:
      $socketPath: '%env(default:app.email_gmail_socket:EMAIL_GMAIL_SOCKET)%'

  App\Service\GmailDraftService:
    arguments:
      $account: '%env(default:app.email_gmail_account:EMAIL_GMAIL_ACCOUNT)%'

  # Dedicated untraced, non-retrying transport: credentials and draft data must
  # not be collected by the application's HTTP profiler.
  app.email_draft_transport:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
    arguments:
      - { max_redirects: 0, verify_peer: true, verify_host: true }

  App\Service\OpenAiEmailDraftClient:
    arguments:
      $client: '@app.email_draft_transport'
      $apiKey: '%env(default::OPENAI_API_KEY)%'
      $model: '%env(default:app.email_model:OPENAI_EMAIL_MODEL)%'
      $reasoning: '%env(default:app.email_reasoning:OPENAI_EMAIL_REASONING)%'

  App\Service\BrowserRetestClientInterface: '@App\Service\PlaywrightBrowserRetestClient'
  App\Cribrum\CribrumClassifier:
    arguments:
      $candidateDirectory: '%env(default:app.cribrum_candidate_directory:CRIBRUM_CANDIDATE_DIRECTORY)%'
      $candidateMode: '%env(default:app.cribrum_candidate_mode:CRIBRUM_CANDIDATE_MODE)%'
  App\Service\BrowserRetestTransportInterface: '@App\Service\PlaywrightBrowserRetestClient'
  App\Service\BrowserScreenshotClientInterface: '@App\Service\PlaywrightBrowserScreenshotClient'
  App\Service\BrowserInteractiveClientInterface: '@App\Service\PlaywrightBrowserInteractiveClient'
  App\Service\FencedBrowserInteractiveClientInterface: '@App\Service\PlaywrightBrowserInteractiveClient'
  App\Service\EvidenceStorageInterface: '@App\Service\LocalEvidenceStorage'
  App\Service\ScreenshotEnqueuerInterface: '@App\Service\ScreenshotQueueService'

  App\Service\WorkerHealthRegistry:
    arguments:
      $workers: '%app.health_workers%'

  App\Service\LocalEvidenceStorage:
    arguments:
      $evidenceDir: '%app.evidence_storage_dir%'

  App\Service\PlaywrightBrowserRetestClient:
    arguments:
      $workerUrl: '%app.playwright_worker_url%'
      $workerToken: '%env(default::PLAYWRIGHT_WORKER_TOKEN)%'

  App\Service\PlaywrightBrowserScreenshotClient:
    arguments:
      $workerUrl: '%app.playwright_worker_url%'
      $workerToken: '%env(default::PLAYWRIGHT_WORKER_TOKEN)%'

  App\Service\PlaywrightBrowserInteractiveClient:
    arguments:
      $workerUrl: '%env(default:app.playwright_worker_url:PLAYWRIGHT_INTERACTIVE_URL)%'
      $workerToken: '%env(default::PLAYWRIGHT_WORKER_TOKEN)%'

  App\Service\InteractiveBrowserLeaseService:
    arguments:
      $ownerKey: '%env(APP_SECRET)%'

  App\Service\InteractiveGatewayControlClient:
    arguments:
      $workerUrl: '%env(default:app.playwright_worker_url:PLAYWRIGHT_INTERACTIVE_URL)%'
      $gatewayToken: '%env(default::PLAYWRIGHT_GATEWAY_TOKEN)%'

  App\Service\InteractiveHealthService:
    arguments:
      $workerUrl: '%env(default:app.playwright_worker_url:PLAYWRIGHT_INTERACTIVE_URL)%'
      $gatewayToken: '%env(default::PLAYWRIGHT_GATEWAY_TOKEN)%'

  App\Controller\InteractiveGatewayAuthController:
    arguments:
      $gatewayToken: '%env(default::PLAYWRIGHT_GATEWAY_TOKEN)%'

  app.security_txt_transport:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
    arguments:
      - { proxy: '', max_redirects: 0, verify_peer: true, verify_host: true }

  app.security_txt_public_client:
    class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
    arguments: ['@app.security_txt_transport']

  App\Service\SecurityTxtProvider:
    arguments:
      $client: '@app.security_txt_public_client'

  app.cribrum_probe_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

  App\Service\CribrumProbeSource:
    arguments:
      $client: '@app.cribrum_probe_client'
